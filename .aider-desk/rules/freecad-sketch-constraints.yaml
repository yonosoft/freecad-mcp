schema_version: 1
policy_id: freecad.sketch.constraint-engineering
policy_version: 1
compatibility:
  required_capabilities:
    - sketch.inspect.snapshot
    - sketch.inspect.topology
    - sketch.inspect.constraint_diagnostics
    - sketch.constraint.add
    - document.recompute
    - document.history.undo
defaults:
  require_fresh_solver_before_decision: true
  require_fresh_solver_after_mutation: true
  maximum_constraints_per_batch: 6
  stop_on_unexpected_dof_effect: true
  stop_on:
    - solver_unavailable
    - solver_stale_after_recompute
    - conflicting_constraints
    - redundant_constraints
    - partially_redundant_constraints
    - malformed_constraints
  prohibited_shortcuts:
    - fixed_geometry
    - block_constraint
    - arbitrary_coordinate_dimensioning
phases:
  - topology
  - orientation
  - shape_relationships
  - datum
  - dimensions
  - remaining_dof
  - parameter_edit_validation
  - final_audit
rules:
  - rule_id: constraint.coincident.declared_endpoint_join
    version: 1
    phase: topology
    priority: 100
    preconditions:
      - declared_topological_join
      - distinct_selected_endpoints
      - solver_state_fresh
    forbid_when:
      - coincidence_already_present
      - coincidence_already_implied
    action:
      constraint_type: coincident
    expected_dof_reduction: {minimum: 1, maximum: 2}
    verification:
      - selected_endpoints_coincident
      - no_new_solver_diagnostics
    rationale: Express profile connectivity explicitly rather than relying on initial placement.

  - rule_id: constraint.horizontal.declared_line
    version: 1
    phase: orientation
    priority: 200
    preconditions:
      - selected_geometry_is_line_segment
      - intended_orientation_horizontal
      - solver_state_fresh
    forbid_when:
      - horizontal_already_present
      - horizontal_already_implied
    action:
      constraint_type: horizontal
    expected_dof_reduction: {minimum: 1, maximum: 1}
    verification:
      - selected_line_horizontal
      - no_new_solver_diagnostics
    rationale: Preserve an intended horizontal edge as a geometric relationship.

  - rule_id: constraint.vertical.declared_line
    version: 1
    phase: orientation
    priority: 210
    preconditions:
      - selected_geometry_is_line_segment
      - intended_orientation_vertical
      - solver_state_fresh
    forbid_when:
      - vertical_already_present
      - vertical_already_implied
    action:
      constraint_type: vertical
    expected_dof_reduction: {minimum: 1, maximum: 1}
    verification:
      - selected_line_vertical
      - no_new_solver_diagnostics
    rationale: Preserve an intended vertical edge as a geometric relationship.

  - rule_id: constraint.tangent.arc_line_endpoint_join
    version: 1
    phase: shape_relationships
    priority: 300
    preconditions:
      - selected_pair_contains_arc_and_line
      - endpoint_coincidence_present
      - intended_transition_smooth
      - solver_state_fresh
    forbid_when:
      - tangent_already_present
      - tangent_already_implied
      - intended_transition_sharp
    action:
      constraint_type: tangent
    expected_dof_reduction: {minimum: 1, maximum: 1}
    verification:
      - selected_join_tangent
      - selected_join_remains_coincident
      - no_new_solver_diagnostics
    rationale: Preserve smooth fillet continuity at an explicit endpoint join.

  - rule_id: constraint.equal.declared_identical_features
    version: 1
    phase: shape_relationships
    priority: 320
    preconditions:
      - selected_geometries_compatible
      - declared_identical_feature_intent
      - solver_state_fresh
    forbid_when:
      - equality_already_present
      - equality_already_implied
      - equality_is_only_incidental
    action:
      constraint_type: equal
    expected_dof_reduction: {minimum: 1, maximum: 1}
    verification:
      - selected_geometries_equal
      - no_new_solver_diagnostics
    rationale: Link genuinely repeated features instead of dimensioning each independently.

  - rule_id: constraint.datum.single_declared_reference
    version: 1
    phase: datum
    priority: 400
    preconditions:
      - declared_datum_strategy
      - selected_reference_is_stable
      - solver_state_fresh
    forbid_when:
      - competing_datum_already_present
      - datum_is_incidental_geometry_state
    action:
      constraint_type: declared_datum_constraint
    expected_dof_reduction: {minimum: 1, maximum: 2}
    verification:
      - datum_relationship_present
      - no_new_solver_diagnostics
    rationale: Establish one explicit placement strategy before adding dimensions.

  - rule_id: constraint.dimension.meaningful_overall
    version: 1
    phase: dimensions
    priority: 500
    preconditions:
      - declared_overall_dimension
      - dimension_controls_design_intent
      - solver_state_fresh
    forbid_when:
      - equivalent_dimension_already_present
      - dimension_duplicates_geometric_relationship
      - dimension_only_eliminates_unexplained_last_dof
    action:
      constraint_type: declared_dimensional_constraint
    expected_dof_reduction: {minimum: 1, maximum: 1}
    verification:
      - dimension_value_matches_intent
      - no_new_solver_diagnostics
    rationale: Prefer overall functional dimensions over unrelated endpoint coordinates.

  - rule_id: prohibition.equal_features_duplicate_dimensions
    version: 1
    phase: dimensions
    priority: 510
    preconditions:
      - equality_constraint_present
      - one_driving_feature_dimension_present
    forbid_when:
      - never
    action:
      constraint_type: prohibit_second_equivalent_dimension
    expected_dof_reduction: {minimum: 0, maximum: 0}
    verification:
      - only_one_driving_dimension_for_equal_feature_group
    rationale: Avoid redundant dimensions on features already related by equality.

  - rule_id: verification.bounded_batch_solver_evidence
    version: 1
    phase: remaining_dof
    priority: 900
    preconditions:
      - bounded_batch_applied
    forbid_when:
      - solver_state_unavailable
    action:
      constraint_type: verify_only
    expected_dof_reduction: {minimum: 0, maximum: 0}
    verification:
      - document_recomputed
      - solver_state_fresh
      - actual_dof_effect_recorded
      - no_new_solver_diagnostics
    rationale: Retain no operation merely because it appeared visually successful.

  - rule_id: prohibition.fixed_or_blocked_geometry
    version: 1
    phase: remaining_dof
    priority: 1000
    preconditions:
      - remaining_dof_present
    forbid_when:
      - always
    action:
      constraint_type: prohibit_fixed_or_block
    expected_dof_reduction: {minimum: 0, maximum: 0}
    verification:
      - no_fixed_geometry
      - no_block_constraint
    rationale: Never conceal missing design reasoning by immobilising geometry.
